# ========= 成本与利润参数（按你的实际情况调整） =========
costing:
  packaging_fee: 0.8        # 二次打包耗材(气泡膜/纸盒/快递袋), 元/件
  inbound_ship: 5.0         # 国内快递送到Temu仓(广州等), 首重1kg内, 元/件
  free_weight_g: 1000       # 超过该重量后开始计超重附加费(克)
  overweight_rate_per_kg: 4.0
  default_weight_g: 200     # 采集不到重量时用于估算的默认值(克)

# 平台分成: Temu全托管下 供货价 ≈ 零售价 × (1 - platform_take)
# 0.5 表示零售价的一半是你的供货价上限(经验粗估, 宁可保守)
fees:
  platform_take: 0.5

search:
  max_pages: 2              # 每次采集的搜索页数(每页约40个商品)
  wait_results_sec: 150     # 等结果/等人工登录的最长秒数

report:
  top_n_console: 10         # 命令行里打印前N个候选

# ========= 风险标记词库 =========
risk:
  # 疑似品牌/侵权词 → 上Temu大概率被罚, 一律避开
  brand_words:
    [迪士尼, disney, 三丽鸥, sanrio, hello kitty, hellokitty, 库洛米, 玉桂狗,
     奥特曼, ultraman, 宝可梦, pokemon, 皮卡丘, 乐高, lego, 万代, bandai,
     泡泡玛特, popmart, molly, nike, 耐克, adidas, 阿迪达斯, jordan, 乔丹,
     lv, gucci, chanel, 香奈儿, 爱马仕, iphone, 苹果同款, 华强北]
  # 需认证/资质的品类 → 不是不能做, 而是先确认认证成本再决定
  cert_rules:
    "玩具(EN71/CPC)": [玩具, 积木, 毛绒, 悠悠球, 弹射, 儿童车]
    "电子电器(CE/FCC)": [充电, 蓝牙, usb, type-c, 电动, 电子, led, 灯串, 风扇, 耳机, 音箱, 数据线]
    "母婴/食品接触(FDA/LFGB)": [奶瓶, 吸管杯, 保鲜盒, 分装瓶, 餐具]
    "液体膏体(物流敏感)": [精油, 香水, 喷雾, 气雾, 酒精, 电池]
